<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0ede6">
<title>댕겨올개 사진 올리기</title>
<link rel="icon" type="image/png" href="logo-180.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --navy:#003B89; --navy-soft:#e8eef8; --yellow:#FCCC00; --yellow-soft:#fff6cc;
    --ink:#16202e; --muted:#6b7280; --line:#e4e0d6; --bg:#f0ede6; --card:#fff;
    --ok:#15803d; --ok-soft:#e9f7ee; --bad:#b91c1c; --bad-soft:#fdeeee;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--ink);
         -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:max(20px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }

  /* 상단 */
  .top { display:flex; align-items:center; gap:10px; margin:4px 2px 22px; }
  .logo { width:56px; height:56px; border-radius:16px; display:block; flex:none; box-shadow:0 4px 14px rgba(0,59,137,.18); }
  .top { gap:12px; }
  .brand { font-weight:800; font-size:17px; letter-spacing:-.02em; color:var(--navy); }
  .brand small { display:block; font-weight:500; font-size:12px; color:var(--muted); letter-spacing:0; margin-top:1px; }

  .hero h1 { font-size:26px; line-height:1.3; letter-spacing:-.035em; margin:0 2px 10px; font-weight:800; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--navy-soft); color:var(--navy);
          font-size:13px; font-weight:700; padding:6px 11px 6px 9px; border-radius:999px; margin:0 2px 18px; }
  .chip svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; }

  .card { background:var(--card); border-radius:22px; padding:14px; box-shadow:0 1px 2px rgba(22,32,46,.04), 0 8px 28px rgba(22,32,46,.06); }

  /* 사진 고르기 */
  .pick { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
          gap:6px; min-height:220px; padding:28px 16px; border-radius:16px; cursor:pointer;
          background:linear-gradient(180deg, #fffdf3 0%, var(--yellow-soft) 100%); border:2px dashed #f1d76a;
          transition:transform .15s ease, border-color .15s ease, background .15s ease; }
  .pick:active { transform:scale(.985); }
  .pick.drag { border-color:var(--navy); background:var(--navy-soft); }
  .pick .ic { width:64px; height:64px; border-radius:20px; background:var(--yellow); display:grid; place-items:center; margin-bottom:8px;
              box-shadow:0 6px 16px rgba(252,204,0,.35); }
  .pick .ic svg { width:30px; height:30px; stroke:var(--navy); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .pick b { font-size:19px; letter-spacing:-.02em; }
  .pick span { font-size:13.5px; color:var(--muted); }
  .pick.busy { pointer-events:none; opacity:.6; min-height:0; padding:12px 16px; flex-direction:row; gap:10px; }
  .pick.busy .ic { width:36px; height:36px; border-radius:11px; margin:0; box-shadow:none; }
  .pick.busy .ic svg { width:18px; height:18px; }
  .pick.busy b { font-size:15px; }
  .pick.busy span { display:none; }
  input[type=file] { display:none; }

  /* 진행 */
  .prog { display:none; padding:18px 6px 6px; }
  .prog.on { display:block; }
  .prog-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .msg { font-size:15px; font-weight:700; }
  .count { font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); font-weight:600; }
  .bar { height:8px; background:#f0ece4; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--navy), #2a6bd1); border-radius:99px; transition:width .25s ease; }
  .thumbs { display:grid; grid-template-columns:repeat(6, 1fr); gap:5px; margin-top:14px; }
  .thumbs img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; background:#f0ece4; display:block; animation:pop .25s ease both; }
  .thumbs .more { aspect-ratio:1; border-radius:8px; background:#f0ece4; display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--muted); }
  @keyframes pop { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:none; } }

  /* 결과 */
  .done, .err { display:none; margin-top:12px; padding:16px; border-radius:16px; font-size:15px; line-height:1.5; }
  .done { background:var(--ok-soft); color:#14532d; }
  .done .big { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:-.02em; }
  .done .big i { width:30px; height:30px; border-radius:50%; background:var(--ok); display:grid; place-items:center; flex:none; }
  .done .big i svg { width:16px; height:16px; stroke:#fff; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .done small { display:block; margin-top:6px; font-size:13px; color:#3f6b4f; }
  .done small.warn { color:var(--bad); }
  .err { background:var(--bad-soft); color:var(--bad); font-weight:600; }

  /* 안내 */
  .tips { list-style:none; margin:20px 4px 0; padding:0; display:grid; gap:12px; }
  .tips li { display:flex; gap:12px; align-items:flex-start; font-size:13.5px; color:#4b5563; line-height:1.5; }
  .tips svg { width:18px; height:18px; flex:none; margin-top:1px; stroke:var(--navy); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.8; }
  .foot { text-align:center; color:#a39e94; font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" src="logo.png" alt="댕겨올개">
    <div class="brand">사진 올리기<small>Pet Kindergarten</small></div>
  </div>

  <div class="hero">
    <h1>오늘 찍은 아이들 사진을<br>올려 주세요</h1>
    <div class="chip"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="day">날짜 확인 중…</span></div>
  </div>

  <div class="card">
    <label class="pick" id="pick-label">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8A1.5 1.5 0 0 1 10.5 3.5h3a1.5 1.5 0 0 1 1.2.7L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.4"/></svg></div>
      <b>사진 고르기</b>
      <span>갤러리에서 여러 장을 한꺼번에 골라 주세요</span>
      <input id="file" type="file" accept="image/*" multiple>
    </label>

    <div class="prog" id="prog">
      <div class="prog-top"><div class="msg" id="msg"></div><div class="count" id="count"></div></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="done" id="done"></div>
    <div class="err" id="err"></div>
  </div>

  <ul class="tips">
    <li><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>같은 사진을 두 번 올려도 한 장만 들어가요.</li>
    <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>다 올라갈 때까지 이 화면을 닫지 말아 주세요.</li>
    <li><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>올린 사진은 원장님 화면에서 아이별로 자동 분류돼요.</li>
  </ul>
  <div class="foot">댕겨올개 · 용인</div>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
import { loadFingerprint, fingerprint } from "./fp.js";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s) => document.querySelector(s);
const token = new URLSearchParams(location.hash.slice(1)).get("k") || new URLSearchParams(location.search).get("k") || "";
const FN = `${SUPABASE_URL}/functions/v1/teacher-upload`;
async function call(body) {
  for (let t = 0; t < 4; t++) {
    try {
      const r = await fetch(FN, { method: "POST", headers: { "content-type": "application/json", apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ token, ...body }) });
      const j = await r.json();
      if (r.status >= 500 && t < 3) { await new Promise((s) => setTimeout(s, 1500 * (t + 1))); continue; }
      if (!r.ok) throw new Error(j.error || "오류");
      return j;
    } catch (e) { if (t === 3) throw e; await new Promise((s) => setTimeout(s, 1500 * (t + 1))); }
  }
}
function showErr(m) { $("#err").textContent = m; $("#err").style.display = "block"; }
// 끌어다 놓기 (컴퓨터에서)
const pickEl = $("#pick-label");
["dragenter", "dragover"].forEach((t) => pickEl.addEventListener(t, (e) => { e.preventDefault(); pickEl.classList.add("drag"); }));
["dragleave", "drop"].forEach((t) => pickEl.addEventListener(t, (e) => { e.preventDefault(); pickEl.classList.remove("drag"); }));
pickEl.addEventListener("drop", (e) => {
  const files = [...(e.dataTransfer?.files || [])].filter((f) => f.type.startsWith("image/"));
  if (files.length) handleFiles(files);
});
function showThumbs(files) {
  const box = $("#thumbs"), max = 11;
  box.querySelectorAll("img").forEach((i) => URL.revokeObjectURL(i.src));
  box.innerHTML = files.slice(0, files.length > 12 ? max : 12).map((f) => `<img src="${URL.createObjectURL(f)}" alt="">`).join("")
    + (files.length > 12 ? `<div class="more">+${files.length - max}</div>` : "");
}

async function resize(file, maxSide, quality) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close?.();
  return await new Promise((r) => c.toBlob(r, "image/jpeg", quality));
}
async function imageStats(blob) {
  const bmp = await createImageBitmap(blob);
  const c = document.createElement("canvas");
  const g = c.getContext("2d", { willReadFrequently: true });
  c.width = 72; c.height = 64; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(bmp, 0, 0, 72, 64);
  const d = g.getImageData(0, 0, 72, 64).data;
  const cell = new Float32Array(72);
  for (let y = 0; y < 64; y++) for (let x = 0; x < 72; x++) { const i = (y * 72 + x) * 4; cell[(y >> 3) * 9 + (x >> 3)] += d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; }
  let hex = "", nib = 0, bits = 0;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { nib = (nib << 1) | (cell[y * 9 + x + 1] > cell[y * 9 + x] ? 1 : 0); if (++bits % 4 === 0) { hex += nib.toString(16); nib = 0; } }
  const sc = Math.min(1, 256 / Math.max(bmp.width, bmp.height));
  const w = Math.max(3, Math.round(bmp.width * sc)), h = Math.max(3, Math.round(bmp.height * sc));
  c.width = w; c.height = h; g.drawImage(bmp, 0, 0, w, h); bmp.close?.();
  const p = g.getImageData(0, 0, w, h).data;
  const G = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) G[i] = p[i * 4] * 0.299 + p[i * 4 + 1] * 0.587 + p[i * 4 + 2] * 0.114;
  let sum = 0, sum2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) { const i = y * w + x; const L = 4 * G[i] - G[i - 1] - G[i + 1] - G[i - w] - G[i + w]; sum += L; sum2 += L * L; n++; }
  return { phash: hex, sharp: n ? sum2 / n - (sum / n) ** 2 : 0 };
}
async function exifTime(file) {
  try {
    const buf = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (buf.getUint16(0) !== 0xffd8) return null;
    let off = 2;
    while (off < buf.byteLength - 4) {
      const marker = buf.getUint16(off), len = buf.getUint16(off + 2);
      if (marker === 0xffe1 && buf.getUint32(off + 4) === 0x45786966) {
        const t = off + 10, le = buf.getUint16(t) === 0x4949;
        const u16 = (o) => buf.getUint16(t + o, le), u32 = (o) => buf.getUint32(t + o, le);
        const readTag = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return { count: u32(e + 4), val: u32(e + 8) }; } return null; };
        const exif = readTag(u32(4), 0x8769);
        const dt = exif && readTag(exif.val, 0x9003);
        if (!dt) return null;
        let str = ""; for (let i = 0; i < 19; i++) str += String.fromCharCode(buf.getUint8(t + dt.val + i));
        const m = str.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return m ? `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}+09:00` : null;
      }
      if ((marker & 0xff00) !== 0xff00) break;
      off += 2 + len;
    }
  } catch { /* 없음 */ }
  return null;
}
async function pool(items, limit, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } }));
}

if (!token) { showErr("링크가 올바르지 않아요. 원장님께 받은 링크로 다시 들어와 주세요."); $("#pick-label").style.display = "none"; $("#day").textContent = "링크 확인 필요"; }
else {
  call({ action: "check" }).then((r) => {
    const [y, m, d] = r.day.split("-");
    $("#day").textContent = `${+m}월 ${+d}일 사진으로 올라가요`;
  }).catch((e) => { showErr(e.message); $("#pick-label").style.display = "none"; $("#day").textContent = "링크 확인 필요"; });
}

$("#file").addEventListener("change", (e) => {
  const files = [...e.target.files];
  e.target.value = "";
  if (files.length) handleFiles(files);
});
async function handleFiles(files) {
  $("#done").style.display = "none"; $("#err").style.display = "none";
  $("#pick-label").classList.add("busy");
  $("#prog").classList.add("on");
  $("#bar").style.width = "0";
  showThumbs(files);
  let n = 0, added = 0, skipped = 0, failed = 0;
  // 사진 지문 모델 준비 (처음 한 번만 다운로드, 실패해도 업로드는 계속)
  let fpReady = false;
  try { $("#msg").textContent = "준비 중… (처음 한 번만 조금 걸려요)"; await loadFingerprint(); fpReady = true; } catch { /* 지문 없이 진행 */ }
  const tick = () => {
    $("#bar").style.width = `${(n / files.length) * 100}%`;
    $("#msg").textContent = "올리는 중…";
    $("#count").textContent = `${n} / ${files.length}장`;
  };
  tick();
  // 20장씩 묶어서: 주소 받기 → 올리기 → 등록
  const chunks = [];
  for (let i = 0; i < files.length; i += 20) chunks.push(files.slice(i, i + 20));
  for (const chunk of chunks) {
    try {
      const prepared = [];
      await pool(chunk, 3, async (file) => {
        try {
          const [full, small, taken] = await Promise.all([resize(file, 1600, 0.85), resize(file, 640, 0.8), exifTime(file)]);
          const st = await imageStats(small).catch(() => ({}));
          const vec = fpReady ? await fingerprint(small) : null;
          prepared.push({ id: crypto.randomUUID(), full, small, taken_at: taken, vec, ...st });
        } catch { failed++; n++; tick(); }
      });
      if (!prepared.length) continue;
      const { urls } = await call({ action: "sign", items: prepared.map((p) => ({ id: p.id })) });
      const ok = [];
      await pool(prepared, 3, async (p) => {
        const u = urls.find((x) => x.id === p.id);
        const a = await sb.storage.from("photos").uploadToSignedUrl(u.fullPath, u.full, p.full, { contentType: "image/jpeg" });
        const b = await sb.storage.from("photos").uploadToSignedUrl(u.thumbPath, u.thumb, p.small, { contentType: "image/jpeg" });
        if (a.error || b.error) failed++; else ok.push(p);
        n++; tick();
      });
      if (ok.length) {
        const r = await call({ action: "done", items: ok.map(({ id, taken_at, phash, sharp, vec }) => ({ id, taken_at, phash, sharp, vec })) });
        added += r.added; skipped += r.skipped;
      }
    } catch (err) {
      failed += chunk.length; n = Math.min(files.length, n + chunk.length); tick();
      showErr(err.message || "올리지 못한 사진이 있어요");
    }
  }
  $("#bar").style.width = "100%";
  $("#prog").classList.remove("on");
  $("#done").innerHTML = `<div class="big"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>${added}장 올렸어요</div>`
    + `<small>더 올릴 사진이 있으면 위에서 다시 골라 주세요</small>`
    + (skipped ? `<small>이미 올라온 똑같은 사진 ${skipped}장은 건너뛰었어요</small>` : "")
    + (failed ? `<small class="warn">${failed}장은 올리지 못했어요. 그 사진만 다시 골라 올려 주세요</small>` : "");
  $("#done").style.display = "block";
  $("#pick-label").classList.remove("busy");
}
</script>
</body>
</html>
