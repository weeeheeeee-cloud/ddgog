<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003B89">
<title>댕겨올개 사진 올리기</title>
<link rel="icon" type="image/png" href="logo-180.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preload" href="fonts/bhs-up.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* 로고처럼 두꺼운 제목 글꼴: 이 화면에 쓰는 글자만 담은 작은 파일 (Black Han Sans, OFL) */
  @font-face { font-family:"BHS Up"; src:url("fonts/bhs-up.woff2") format("woff2"); font-weight:400 900; font-display:swap; }
  :root {
    --navy:#003B89; --navy-2:#0b4aa3; --yellow:#FCCC00; --cream:#f0ede6; --cream-2:#e6e1d6;
    --ink:#0f1b2d; --muted:#6c7280; --ok:#15803d; --bad:#b91c1c;
    --display:"BHS Up", Pretendard, sans-serif;
  }
  .hero h1, .pick b, .count, .done .big, .tips li::before { font-synthesis:none; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--navy); color:var(--ink);
         -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; min-height:100vh; }

  /* 위: 남색 포스터 */
  .hero { position:relative; overflow:hidden; color:var(--cream);
          padding:calc(26px + env(safe-area-inset-top)) 24px 64px; max-width:520px; margin:0 auto; }
  .logo { width:76px; height:76px; border-radius:20px; display:block; }
  .hero h1 { font-family:var(--display); font-weight:900; font-size:44px; line-height:1.08; letter-spacing:-.01em; margin:26px 0 18px; }
  .hero h1 em { font-style:normal; color:var(--yellow); }
  .day { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--cream);
         padding:8px 14px 8px 10px; border-radius:999px; border:1.5px solid rgba(240,237,230,.35); }
  .day i { width:8px; height:8px; border-radius:50%; background:var(--yellow); box-shadow:0 0 0 4px rgba(252,204,0,.22); }

  /* 아래: 크림 시트 */
  .sheet { background:var(--cream); border-radius:30px 30px 0 0; margin:-34px auto 0; max-width:520px; position:relative;
           padding:26px 18px calc(30px + env(safe-area-inset-bottom)); min-height:60vh; }

  /* 사진 고르기: 로고의 노란 막대 */
  .pick { display:flex; align-items:center; gap:16px; background:var(--yellow); border-radius:999px; padding:12px 26px 12px 12px;
          cursor:pointer; box-shadow:0 10px 0 -2px #d8ae00, 0 18px 30px rgba(0,59,137,.18); transition:transform .12s ease, box-shadow .12s ease; }
  .pick:active { transform:translateY(5px); box-shadow:0 5px 0 -2px #d8ae00, 0 10px 18px rgba(0,59,137,.16); }
  .pick .face { width:66px; height:66px; border-radius:50%; background:var(--navy); display:grid; place-items:center; flex:none; }
  .smile { width:46px; height:30px; }
  .smile .nose { fill:var(--yellow); }
  .smile .mouth { fill:none; stroke:var(--cream); stroke-width:3.2; stroke-linecap:round; }
  .smile circle { fill:var(--cream); }
  .pick .txt { flex:1; min-width:0; }
  .pick b { display:block; font-family:var(--display); font-weight:900; font-size:28px; color:var(--navy); line-height:1.1; }
  .pick span { display:block; font-size:13px; font-weight:600; color:#5a4a00; margin-top:3px; }
  .pick .arr { width:26px; height:26px; flex:none; stroke:var(--navy); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .pick.drag { outline:3px dashed var(--navy); outline-offset:5px; }
  .pick.busy { pointer-events:none; filter:saturate(.4); opacity:.55; }
  input[type=file] { display:none; }

  /* 진행 */
  .prog { display:none; margin-top:26px; background:#fff; border-radius:24px; padding:20px; }
  .prog.on { display:block; }
  .prog-top { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .msg { font-size:14px; font-weight:700; color:var(--muted); line-height:1.35; }
  .msg .sub { display:block; font-size:12px; font-weight:600; color:#9aa0a8; margin-top:3px; }
  .count { font-family:var(--display); font-weight:900; font-size:34px; color:var(--navy); line-height:1; font-variant-numeric:tabular-nums; }
  .count small { font-family:Pretendard, sans-serif; font-size:14px; font-weight:700; color:var(--muted); margin-left:2px; }
  .bar { height:14px; background:var(--cream); border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--yellow); border-radius:99px; transition:width .25s ease;
           background-image:repeating-linear-gradient(-45deg, rgba(0,59,137,.12) 0 6px, transparent 6px 12px); }
  .thumbs { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin-top:16px; }
  .thumbs img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--cream); display:block; animation:pop .25s ease both; }
  .thumbs .more { aspect-ratio:1; border-radius:10px; background:var(--navy); color:var(--cream); display:grid; place-items:center; font-size:12px; font-weight:800; }
  @keyframes pop { from { opacity:0; transform:scale(.88); } to { opacity:1; transform:none; } }

  /* 결과 */
  .done, .err { display:none; margin-top:26px; border-radius:24px; padding:22px 20px; font-size:15px; line-height:1.5; }
  .done { background:var(--navy); color:var(--cream); }
  .done .big { display:flex; align-items:center; gap:12px; font-family:var(--display); font-weight:900; font-size:28px; line-height:1.1; }
  .done .big i { width:40px; height:40px; border-radius:50%; background:var(--yellow); display:grid; place-items:center; flex:none; }
  .done .big i svg { width:20px; height:20px; stroke:var(--navy); fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
  .done small { display:block; margin-top:8px; font-size:13.5px; color:rgba(240,237,230,.75); }
  .done small:first-of-type { margin-top:14px; }
  .done small.warn { color:#ffb4a8; }
  .err { background:#fde8e6; color:var(--bad); font-weight:700; }

  /* 안내 */
  .tips { list-style:none; margin:30px 4px 0; padding:0; display:grid; gap:14px; counter-reset:t; }
  .tips li { counter-increment:t; display:flex; gap:14px; align-items:center; font-size:14px; color:#3b4352; line-height:1.45; }
  .tips li::before { content:counter(t); font-family:var(--display); font-weight:900; font-size:15px; color:var(--navy); width:30px; height:30px; flex:none;
                     border-radius:50%; border:1.5px solid var(--navy); display:grid; place-items:center; }
  .foot { text-align:center; color:#a29c8f; font-size:11px; letter-spacing:.2em; margin-top:34px; font-weight:700; }
</style>
</head>
<body>
<header class="hero">
  <img class="logo" src="logo.png" alt="댕겨올개">
  <h1>오늘의 사진,<br><em>올려</em> 주세요</h1>
  <div class="day"><i></i><span id="day">날짜 확인 중…</span></div>
</header>

<main class="sheet">
  <label class="pick" id="pick-label">
    <div class="face"><svg class="smile" viewBox="0 0 64 40"><path class="nose" d="M32 15.5c-1.6-2.2-6-1.5-6 1.6 0 2.6 3.4 4.6 6 6.4 2.6-1.8 6-3.8 6-6.4 0-3.1-4.4-3.8-6-1.6z"/><path class="mouth" d="M32 23.5c0 5-4 8.5-9 8.5s-8.5-3.4-8.5-7.6M32 23.5c0 5 4 8.5 9 8.5s8.5-3.4 8.5-7.6"/><circle cx="20" cy="18" r="1.4"/><circle cx="16" cy="21.5" r="1.4"/><circle cx="44" cy="18" r="1.4"/><circle cx="48" cy="21.5" r="1.4"/></svg></div>
    <div class="txt"><b>사진 고르기</b><span>갤러리에서 여러 장 한꺼번에</span></div>
    <svg class="arr" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <input id="file" type="file" accept="image/*" multiple>
  </label>

  <div class="prog" id="prog">
    <div class="prog-top"><div class="msg" id="msg"></div><div class="count" id="count"></div></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="done" id="done"></div>
  <div class="err" id="err"></div>

  <ul class="tips">
    <li>같은 사진을 두 번 올려도 한 장만 들어가요.</li>
    <li>‘사진 준비 중’이 끝나면 다른 앱을 봐도 돼요. 돌아오면 이어서 올려요.</li>
    <li>원장님 화면에서 아이별로 자동 분류돼요.</li>
  </ul>
  <div class="foot">DAENGGYEOLGAE · YONGIN</div>
</main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
import { loadFingerprint, fingerprint } from "./fp.js";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s) => document.querySelector(s);
const token = new URLSearchParams(location.hash.slice(1)).get("k") || new URLSearchParams(location.search).get("k") || "";
const FN = `${SUPABASE_URL}/functions/v1/teacher-upload`;
async function call(body) {
  for (let t = 0; t < 4; t++) {
    try {
      const r = await fetch(FN, { method: "POST", headers: { "content-type": "application/json", apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ token, ...body }) });
      const j = await r.json();
      if (r.status >= 500 && t < 3) { await new Promise((s) => setTimeout(s, 1500 * (t + 1))); continue; }
      if (!r.ok) throw new Error(j.error || "오류");
      return j;
    } catch (e) { if (t === 3) throw e; await new Promise((s) => setTimeout(s, 1500 * (t + 1))); }
  }
}
function showErr(m) { $("#err").textContent = m; $("#err").style.display = "block"; }
// 끌어다 놓기 (컴퓨터에서)
const pickEl = $("#pick-label");
["dragenter", "dragover"].forEach((t) => pickEl.addEventListener(t, (e) => { e.preventDefault(); pickEl.classList.add("drag"); }));
["dragleave", "drop"].forEach((t) => pickEl.addEventListener(t, (e) => { e.preventDefault(); pickEl.classList.remove("drag"); }));
pickEl.addEventListener("drop", (e) => {
  const files = [...(e.dataTransfer?.files || [])].filter((f) => f.type.startsWith("image/"));
  if (files.length) handleFiles(files);
});
function showThumbs(files) {
  const box = $("#thumbs"), max = 11;
  box.querySelectorAll("img").forEach((i) => URL.revokeObjectURL(i.src));
  box.innerHTML = files.slice(0, files.length > 12 ? max : 12).map((f) => `<img src="${URL.createObjectURL(f)}" alt="">`).join("")
    + (files.length > 12 ? `<div class="more">+${files.length - max}</div>` : "");
}

async function resize(file, maxSide, quality) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close?.();
  return await new Promise((r) => c.toBlob(r, "image/jpeg", quality));
}
async function imageStats(blob) {
  const bmp = await createImageBitmap(blob);
  const c = document.createElement("canvas");
  const g = c.getContext("2d", { willReadFrequently: true });
  c.width = 72; c.height = 64; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(bmp, 0, 0, 72, 64);
  const d = g.getImageData(0, 0, 72, 64).data;
  const cell = new Float32Array(72);
  for (let y = 0; y < 64; y++) for (let x = 0; x < 72; x++) { const i = (y * 72 + x) * 4; cell[(y >> 3) * 9 + (x >> 3)] += d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; }
  let hex = "", nib = 0, bits = 0;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { nib = (nib << 1) | (cell[y * 9 + x + 1] > cell[y * 9 + x] ? 1 : 0); if (++bits % 4 === 0) { hex += nib.toString(16); nib = 0; } }
  const sc = Math.min(1, 256 / Math.max(bmp.width, bmp.height));
  const w = Math.max(3, Math.round(bmp.width * sc)), h = Math.max(3, Math.round(bmp.height * sc));
  c.width = w; c.height = h; g.drawImage(bmp, 0, 0, w, h); bmp.close?.();
  const p = g.getImageData(0, 0, w, h).data;
  const G = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) G[i] = p[i * 4] * 0.299 + p[i * 4 + 1] * 0.587 + p[i * 4 + 2] * 0.114;
  let sum = 0, sum2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) { const i = y * w + x; const L = 4 * G[i] - G[i - 1] - G[i + 1] - G[i - w] - G[i + w]; sum += L; sum2 += L * L; n++; }
  return { phash: hex, sharp: n ? sum2 / n - (sum / n) ** 2 : 0 };
}
async function exifTime(file) {
  try {
    const buf = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (buf.getUint16(0) !== 0xffd8) return null;
    let off = 2;
    while (off < buf.byteLength - 4) {
      const marker = buf.getUint16(off), len = buf.getUint16(off + 2);
      if (marker === 0xffe1 && buf.getUint32(off + 4) === 0x45786966) {
        const t = off + 10, le = buf.getUint16(t) === 0x4949;
        const u16 = (o) => buf.getUint16(t + o, le), u32 = (o) => buf.getUint32(t + o, le);
        const readTag = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return { count: u32(e + 4), val: u32(e + 8) }; } return null; };
        const exif = readTag(u32(4), 0x8769);
        const dt = exif && readTag(exif.val, 0x9003);
        if (!dt) return null;
        let str = ""; for (let i = 0; i < 19; i++) str += String.fromCharCode(buf.getUint8(t + dt.val + i));
        const m = str.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return m ? `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}+09:00` : null;
      }
      if ((marker & 0xff00) !== 0xff00) break;
      off += 2 + len;
    }
  } catch { /* 없음 */ }
  return null;
}
async function pool(items, limit, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } }));
}

if (!token) { showErr("링크가 올바르지 않아요. 원장님께 받은 링크로 다시 들어와 주세요."); $("#pick-label").style.display = "none"; $("#day").textContent = "링크 확인 필요"; }
else {
  call({ action: "check" }).then((r) => {
    const [y, m, d] = r.day.split("-");
    $("#day").textContent = `${+m}월 ${+d}일 사진으로 올라가요`;
  }).catch((e) => { showErr(e.message); $("#pick-label").style.display = "none"; $("#day").textContent = "링크 확인 필요"; });
}

$("#file").addEventListener("change", (e) => {
  const files = [...e.target.files];
  e.target.value = "";
  if (files.length) handleFiles(files);
});

/* ---------- 올릴 사진을 휴대폰에 먼저 저장해 두고 차례로 올리기 ----------
   화면을 벗어나면 휴대폰이 잠시 멈추게 하지만, 돌아오면(또는 링크를 다시 열면) 멈춘 데서 이어서 올림 */
const DB = new Promise((res, rej) => {
  const r = indexedDB.open("ddg-upload", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("q", { keyPath: "id" });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function q(mode, fn) {
  const db = await DB;
  return new Promise((res, rej) => {
    const tx = db.transaction("q", mode); const st = tx.objectStore("q");
    const out = fn(st);
    tx.oncomplete = () => res(out?.result ?? out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const qPut = (item) => q("readwrite", (st) => st.put(item));
const qDel = (ids) => q("readwrite", (st) => ids.forEach((id) => st.delete(id)));
const qAll = async () => (await q("readonly", (st) => st.getAll())).filter((x) => x.token === token);

const run = { active: false, total: 0, done: 0, added: 0, skipped: 0, failed: 0, prepping: 0 };
let wake = null;
async function keepAwake() { try { if ("wakeLock" in navigator && !wake && document.visibilityState === "visible") { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => (wake = null)); } } catch { /* 지원 안 함 */ } }
function draw() {
  const total = Math.max(run.total, 1);
  $("#prog").classList.add("on");
  $("#pick-label").classList.add("busy");
  $("#bar").style.width = `${(run.done / total) * 100}%`;
  $("#msg").innerHTML = run.prepping ? `사진 준비 중… <small class="sub">이 단계만 화면을 켜 두세요</small>`
    : `올리는 중… <small class="sub">다른 앱을 봐도 돼요. 돌아오면 이어서 올려요</small>`;
  $("#count").innerHTML = `${run.done}<small>/ ${run.total}장</small>`;
}
function finish() {
  $("#bar").style.width = "100%";
  $("#prog").classList.remove("on");
  $("#done").innerHTML = `<div class="big"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>${run.added}장 올렸어요</div>`
    + `<small>더 올릴 사진이 있으면 위에서 다시 골라 주세요</small>`
    + (run.skipped ? `<small>이미 올라온 똑같은 사진 ${run.skipped}장은 건너뛰었어요</small>` : "")
    + (run.failed ? `<small class="warn">${run.failed}장은 올리지 못했어요. 그 사진만 다시 골라 올려 주세요</small>` : "");
  $("#done").style.display = "block";
  $("#pick-label").classList.remove("busy");
  Object.assign(run, { total: 0, done: 0, added: 0, skipped: 0, failed: 0 });
  wake?.release?.(); wake = null;
}

// 1단계: 고른 사진을 줄여서 휴대폰에 저장 (빠름). 저장되면 화면을 벗어나도 사진을 다시 고를 필요 없음
async function handleFiles(files) {
  $("#done").style.display = "none"; $("#err").style.display = "none";
  showThumbs(files);
  run.total += files.length; run.prepping += files.length;
  keepAwake(); draw();
  await pool(files, 4, async (file) => {
    try {
      const [full, small, taken] = await Promise.all([resize(file, 1600, 0.85), resize(file, 640, 0.8), exifTime(file)]);
      await qPut({ id: crypto.randomUUID(), token, full, small, taken_at: taken, tries: 0, at: Date.now() });
    } catch { run.failed++; run.done++; }
    run.prepping--; draw();
    upload(); // 준비되는 대로 바로 올리기 시작
  });
}

// 2단계: 저장된 사진을 올리고 등록 (멈췄다가 돌아오면 이어서)
let fpReady = null;
async function upload() {
  if (run.active) return;
  run.active = true;
  try {
    if (fpReady === null) { fpReady = false; try { await loadFingerprint(); fpReady = true; } catch { /* 지문 없이 진행 */ } }
    for (;;) {
      const all = (await qAll()).sort((x, y) => x.at - y.at);
      const next = all.filter((x) => !x.busy).slice(0, 10);
      if (!next.length) break;
      if (!run.total) { run.total = all.length; }
      draw();
      let urls;
      try { ({ urls } = await call({ action: "sign", items: next.map((p) => ({ id: p.id })) })); }
      catch (e) { if (!navigator.onLine || document.hidden) break; throw e; }
      const ok = [];
      await pool(next, 4, async (p) => {
        const u = urls.find((x) => x.id === p.id);
        const put = async (path, tk, blob) => {
          const r = await sb.storage.from("photos").uploadToSignedUrl(path, tk, blob, { contentType: "image/jpeg" });
          if (r.error && !/exist|duplicate/i.test(r.error.message || "")) throw r.error;
        };
        try {
          await put(u.fullPath, u.full, p.full);
          await put(u.thumbPath, u.thumb, p.small);
          const st = await imageStats(p.small).catch(() => ({}));
          const vec = fpReady ? await fingerprint(p.small).catch(() => null) : null;
          ok.push({ id: p.id, taken_at: p.taken_at, vec, ...st });
        } catch {
          // 화면을 벗어나서 끊긴 거면 다음에 다시. 여러 번 실패하면 포기
          if (document.hidden || !navigator.onLine) return;
          p.tries = (p.tries || 0) + 1;
          if (p.tries >= 4) { await qDel([p.id]); run.failed++; run.done++; draw(); }
          else await qPut(p);
        }
      });
      if (ok.length) {
        const r = await call({ action: "done", items: ok });
        run.added += r.added; run.skipped += r.skipped;
        await qDel(ok.map((x) => x.id));
        run.done += ok.length; draw();
      }
      if (document.hidden) break; // 백그라운드에서 멈추면 돌아왔을 때 이어서
    }
  } catch (err) {
    showErr((err && err.message) || "잠시 연결이 끊겼어요. 돌아오면 이어서 올려요");
  } finally {
    run.active = false;
  }
  const left = (await qAll()).length;
  if (!left && !run.prepping && run.total) finish();
  else if (left && !document.hidden && navigator.onLine) setTimeout(upload, 3000);
}

// 돌아오면 이어서 올리기
document.addEventListener("visibilitychange", () => { if (!document.hidden) { $("#err").style.display = "none"; keepAwake(); upload(); } });
addEventListener("online", () => upload());
// 링크를 다시 열었을 때 남은 사진이 있으면 이어서
if (token) qAll().then((left) => {
  if (!left.length) return;
  run.total = left.length;
  $("#err").style.display = "none";
  draw();
  $("#msg").innerHTML = `지난번에 다 못 올린 사진 ${left.length}장을 이어서 올릴게요`;
  upload();
}).catch(() => {});
</script>
