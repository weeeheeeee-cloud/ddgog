<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003B89">
<title>댕겨올개 사진함</title>
<link rel="icon" type="image/png" href="logo-180.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="preload" href="fonts/bhs-up.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="boot-loading" style="font-family:sans-serif;color:#6b7280;text-align:center;padding:40vh 16px 0;background:#f0ede6;min-height:100vh;margin:-8px">불러오는 중…</div>
<script>
  // 화면(shell.html)·스타일·스크립트를 매번 최신으로 불러옴 → 수정 사항이 바로 반영됨
  (async () => {
    const v = Date.now();
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "style.css?v=" + v;
    document.head.appendChild(css);
    await new Promise((r) => { css.onload = r; css.onerror = r; });
    const html = await fetch("shell.html?v=" + v, { cache: "no-store" }).then((r) => r.text());
    document.body.innerHTML = html;
    await import("./app.js?v=" + v);
  })().catch(() => {
    const el = document.getElementById("boot-loading");
    if (el) el.textContent = "불러오지 못했어요. 새로고침해 주세요.";
  });
</script>
</body>
</html>
