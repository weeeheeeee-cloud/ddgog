<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003B89">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>댕겨올개 픽드랍 신청</title>
<link rel="icon" type="image/png" href="logo-180.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --navy:#003B89; --yellow:#FCCC00; --cream:#f0ede6; --cream-2:#e6e1d6;
    --ink:#0f1b2d; --muted:#6c7280; --ok:#15803d; --bad:#b91c1c;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--navy); color:var(--ink);
         -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; min-height:100vh; }
  button, textarea { font:inherit; }

  .hero { color:var(--cream); padding:calc(26px + env(safe-area-inset-top)) 24px 62px; max-width:520px; margin:0 auto; }
  .logo { width:64px; height:64px; border-radius:18px; display:block; }
  .hero h1 { font-weight:900; font-size:34px; line-height:1.15; letter-spacing:-.02em; margin:22px 0 10px; }
  .hero h1 em { font-style:normal; color:var(--yellow); }
  .hero p { margin:0; font-size:14px; font-weight:600; color:rgba(240,237,230,.75); line-height:1.5; }

  .sheet { background:var(--cream); border-radius:30px 30px 0 0; margin:-34px auto 0; max-width:520px; min-height:62vh;
           padding:22px 18px calc(30px + env(safe-area-inset-bottom)); }

  .weeks { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--cream-2); padding:5px; border-radius:18px; }
  .weeks button { border:0; background:none; border-radius:14px; padding:10px 6px; cursor:pointer; color:#4b5260; font-weight:800; font-size:15px; }
  .weeks button small { display:block; font-weight:600; font-size:12px; color:var(--muted); margin-top:1px; }
  .weeks button.on { background:#fff; color:var(--navy); box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .weeks button .st { display:inline-block; font-size:11px; font-weight:800; padding:1px 7px; border-radius:99px; margin-left:4px; vertical-align:1px; }
  .st.ok { background:#dcfce7; color:var(--ok); }
  .st.no { background:#fff4c2; color:#7a5d00; }

  h2 { font-size:15px; font-weight:800; margin:24px 4px 10px; color:var(--navy); }
  h2 small { font-weight:600; color:var(--muted); font-size:12.5px; margin-left:4px; }

  .days { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
  .d { border:0; border-radius:16px; background:#fff; padding:12px 0 10px; cursor:pointer; text-align:center; color:var(--ink);
       box-shadow:0 1px 0 rgba(0,0,0,.04); transition:transform .1s ease; }
  .d:active { transform:scale(.95); }
  .d b { display:block; font-size:18px; font-weight:900; }
  .d small { display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-top:2px; }
  .d.we b { color:#b45309; }
  .d.on { background:var(--navy); color:#fff; box-shadow:0 4px 0 -1px #00265a; }
  .d.on b, .d.on small { color:#fff; }
  .d.on small { opacity:.8; }
  .d.on::after { content:"✓"; display:block; font-size:12px; font-weight:900; color:var(--yellow); line-height:1; margin-top:3px; }
  .d:not(.on)::after { content:""; display:block; height:12px; margin-top:3px; }
  .d:disabled { opacity:.38; cursor:default; }
  .d:disabled small::after { content:" 지남"; }

  .quick { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .quick button { border:1.5px solid #d6d0c3; background:transparent; border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700; color:#4b5260; cursor:pointer; }

  textarea { width:100%; min-height:84px; border:0; border-radius:18px; padding:14px 16px; font-size:15px; background:#fff; resize:vertical; color:var(--ink); }
  textarea::placeholder { color:#a6a29a; }

  .save { width:100%; margin-top:22px; border:0; border-radius:999px; background:var(--yellow); color:var(--navy); font-weight:900; font-size:19px;
          padding:17px; cursor:pointer; box-shadow:0 8px 0 -2px #d8ae00, 0 14px 26px rgba(0,59,137,.16); transition:transform .1s ease, box-shadow .1s ease; }
  .save:active { transform:translateY(4px); box-shadow:0 4px 0 -2px #d8ae00, 0 8px 16px rgba(0,59,137,.14); }
  .save:disabled { opacity:.55; pointer-events:none; }
  .sel { text-align:center; font-size:13.5px; font-weight:700; color:var(--muted); margin:12px 0 0; min-height:20px; }

  .done { display:none; margin-top:18px; background:var(--navy); color:var(--cream); border-radius:22px; padding:18px 20px; }
  .done.on { display:block; animation:pop .25s ease both; }
  .done b { display:flex; align-items:center; gap:10px; font-size:19px; font-weight:900; }
  .done b i { width:30px; height:30px; border-radius:50%; background:var(--yellow); color:var(--navy); display:grid; place-items:center; font-style:normal; font-size:16px; flex:none; }
  .done span { display:block; margin-top:8px; font-size:14px; color:rgba(240,237,230,.85); line-height:1.5; }
  .err { display:none; margin-top:18px; background:#fde8e6; color:var(--bad); font-weight:700; border-radius:18px; padding:14px 16px; font-size:14.5px; }
  .err.on { display:block; }
  @keyframes pop { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:none; } }

  .note { margin:26px 6px 0; font-size:13px; color:#6b6458; line-height:1.6; }
  .note b { color:var(--navy); }
  .loading { text-align:center; color:var(--muted); padding:40px 0; font-weight:600; }
  .foot { text-align:center; color:#a29c8f; font-size:11px; letter-spacing:.2em; margin-top:30px; font-weight:700; }
</style>
</head>
<body>
<header class="hero">
  <img class="logo" src="logo.png" alt="댕겨올개">
  <h1 id="title"><em>픽드랍</em> 신청</h1>
  <p>픽드랍이 필요한 요일을 모두 눌러 주세요.<br>바뀌면 언제든 다시 들어와서 고치면 돼요.</p>
</header>

<main class="sheet">
  <div id="body" class="loading">불러오는 중…</div>
  <div id="err" class="err"></div>
  <div class="foot">DAENGGYEOLGAE</div>
</main>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
const FN = `${SUPABASE_URL}/functions/v1/pd`;
const token = new URLSearchParams(location.search).get("k") || new URLSearchParams(location.hash.slice(1)).get("k") || "";
const DOW = ["", "월", "화", "수", "목", "금", "토", "일"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const addDays = (d, n) => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const dayList = (days) => days.length ? days.map((d) => DOW[d]).join("·") : "없음";

async function call(body) {
  const r = await fetch(FN, { method: "POST", headers: { "content-type": "application/json", apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ token, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || "연결하지 못했어요. 잠시 후 다시 해 주세요.");
  return j;
}
function showErr(m) { const e = $("#err"); e.textContent = m; e.classList.add("on"); }

let S = null; // { dog, today, weeks }
let wi = 0;   // 고른 주
let pick = new Set();

function render() {
  const w = S.weeks[wi];
  const isThis = wi === 0;
  const dates = [1, 2, 3, 4, 5, 6, 7].map((d) => addDays(w.start, d - 1));
  $("#body").className = "";
  $("#body").innerHTML = `
    <div class="weeks">${S.weeks.map((x, i) => `<button data-w="${i}" class="${i === wi ? "on" : ""}">${i === 0 ? "이번 주" : "다음 주"}
      <span class="st ${x.saved ? "ok" : "no"}">${x.saved ? "신청함" : "아직"}</span><small>${md(x.start)} ~ ${md(addDays(x.start, 6))}</small></button>`).join("")}</div>

    <h2>요일 고르기 <small>여러 개 고를 수 있어요</small></h2>
    <div class="days">${dates.map((dt, i) => {
      const d = i + 1;
      const past = isThis && dt < S.today;
      return `<button class="d ${d >= 6 ? "we" : ""} ${pick.has(d) ? "on" : ""}" data-d="${d}" ${past ? "disabled" : ""}><b>${DOW[d]}</b><small>${md(dt)}</small></button>`;
    }).join("")}</div>
    <div class="quick">
      <button data-q="wk">월~금 모두</button>
      <button data-q="none">이번엔 필요 없어요</button>
    </div>

    <h2>메모 <small>필요할 때만</small></h2>
    <textarea id="memo" maxlength="300" placeholder="예) 수요일은 9시 전에 와 주세요 / 금요일은 드랍만 해 주세요">${esc(w.memo)}</textarea>

    <button id="save" class="save">${w.saved ? "고친 내용 저장하기" : "신청하기"}</button>
    <p class="sel" id="sel"></p>
    <div id="done" class="done"></div>

    <p class="note">🐾 <b>매주 일요일까지</b> 다음 주 요일을 알려 주세요.<br>주중에 바꾸셔도 선생님들께 바로 알림이 가요.</p>`;

  const updSel = () => { $("#sel").textContent = pick.size ? `고른 요일: ${dayList([...pick].sort())}` : "고른 요일이 없어요 (픽드랍 안 함)"; };
  updSel();
  document.querySelectorAll("[data-w]").forEach((b) => b.onclick = () => { wi = +b.dataset.w; pick = new Set(S.weeks[wi].days); render(); });
  document.querySelectorAll(".d").forEach((b) => b.onclick = () => {
    const d = +b.dataset.d;
    pick.has(d) ? pick.delete(d) : pick.add(d);
    b.classList.toggle("on", pick.has(d));
    $("#done").classList.remove("on");
    updSel();
  });
  const pastSet = new Set(dates.map((dt, i) => (isThis && dt < S.today ? i + 1 : 0)).filter(Boolean));
  document.querySelector('[data-q="wk"]').onclick = () => {
    [1, 2, 3, 4, 5].forEach((d) => !pastSet.has(d) && pick.add(d));
    render();
  };
  document.querySelector('[data-q="none"]').onclick = () => {
    [...pick].forEach((d) => !pastSet.has(d) && pick.delete(d));
    render();
  };
  $("#save").onclick = save;
}

async function save() {
  const w = S.weeks[wi];
  const btn = $("#save");
  btn.disabled = true; btn.textContent = "저장하는 중…";
  $("#err").classList.remove("on");
  try {
    const memo = $("#memo").value;
    const r = await call({ action: "save", week_start: w.start, days: [...pick], memo });
    Object.assign(w, { saved: true, days: r.days, memo: r.memo || "" });
    pick = new Set(r.days);
    render();
    const done = $("#done");
    done.innerHTML = `<b><i>✓</i>저장했어요</b><span>${wi === 0 ? "이번 주" : "다음 주"} (${md(w.start)}~${md(addDays(w.start, 6))}) 픽드랍: <b style="display:inline;color:var(--yellow);font-size:inherit">${dayList(r.days)}</b>${r.memo ? `<br>메모: ${esc(r.memo)}` : ""}</span>`;
    done.classList.add("on");
    done.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) {
    showErr(e.message);
    btn.disabled = false; btn.textContent = "다시 저장하기";
  }
}

(async () => {
  if (!token) { $("#body").innerHTML = ""; showErr("링크가 맞지 않아요. 댕겨올개에서 받은 링크로 다시 열어 주세요."); return; }
  try {
    S = await call({ action: "get" });
    $("#title").innerHTML = `${esc(S.dog.name)}<br><em>픽드랍</em> 신청`;
    document.title = `${S.dog.name} 픽드랍 신청 · 댕겨올개`;
    const sunday = new Date(S.today + "T00:00:00Z").getUTCDay() === 0;
    wi = sunday ? 1 : 0; // 일요일엔 다음 주부터
    pick = new Set(S.weeks[wi].days);
    render();
  } catch (e) { $("#body").innerHTML = ""; showErr(e.message); }
})();
</script>
</body>
</html>
