<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003B89">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>댕겨올개 픽드랍 신청</title>
<link rel="icon" type="image/png" href="logo-180.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --navy:#003B89; --yellow:#FCCC00; --cream:#f0ede6; --cream-2:#e6e1d6;
    --ink:#0f1b2d; --muted:#6c7280; --ok:#15803d; --bad:#b91c1c;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--navy); color:var(--ink);
         -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; min-height:100vh; }
  button, textarea { font:inherit; }

  .hero { color:var(--cream); padding:calc(26px + env(safe-area-inset-top)) 24px 62px; max-width:520px; margin:0 auto; }
  .logo { width:64px; height:64px; border-radius:18px; display:block; }
  .hero h1 { font-weight:900; font-size:34px; line-height:1.15; letter-spacing:-.02em; margin:22px 0 10px; }
  .hero h1 em { font-style:normal; color:var(--yellow); }
  .hero p { margin:0; font-size:14px; font-weight:600; color:rgba(240,237,230,.75); line-height:1.5; }

  .sheet { background:var(--cream); border-radius:30px 30px 0 0; margin:-34px auto 0; max-width:520px; min-height:62vh;
           padding:22px 18px calc(30px + env(safe-area-inset-bottom)); }

  .weeks { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--cream-2); padding:5px; border-radius:18px; }
  .weeks button { border:0; background:none; border-radius:14px; padding:10px 6px; cursor:pointer; color:#4b5260; font-weight:800; font-size:15px; }
  .weeks button small { display:block; font-weight:600; font-size:12px; color:var(--muted); margin-top:1px; }
  .weeks button.on { background:#fff; color:var(--navy); box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .weeks button .st { display:inline-block; font-size:11px; font-weight:800; padding:1px 7px; border-radius:99px; margin-left:4px; vertical-align:1px; }
  .st.ok { background:#dcfce7; color:var(--ok); }
  .st.no { background:#fff4c2; color:#7a5d00; }

  h2 { font-size:15px; font-weight:800; margin:24px 4px 10px; color:var(--navy); }
  h2 small { font-weight:600; color:var(--muted); font-size:12.5px; margin-left:4px; }

  .days { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
  .d { border:0; border-radius:16px; background:#fff; padding:12px 0 10px; cursor:pointer; text-align:center; color:var(--ink);
       box-shadow:0 1px 0 rgba(0,0,0,.04); transition:transform .1s ease; }
  .d:active { transform:scale(.95); }
  .d b { display:block; font-size:18px; font-weight:900; }
  .d small { display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-top:2px; }
  .d.we b { color:#b45309; }
  .d.on { background:var(--navy); color:#fff; box-shadow:0 4px 0 -1px #00265a; }
  .d.on b, .d.on small { color:#fff; }
  .d.on small { opacity:.8; }
  .d.on::after { content:"✓"; display:block; font-size:12px; font-weight:900; color:var(--yellow); line-height:1; margin-top:3px; }
  .d:not(.on)::after { content:""; display:block; height:12px; margin-top:3px; }
  .d:disabled { opacity:.38; cursor:default; }
  .d:disabled small::after { content:" 지남"; }

  .quick { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .quick button { border:1.5px solid #d6d0c3; background:transparent; border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700; color:#4b5260; cursor:pointer; }

  textarea { width:100%; min-height:84px; border:0; border-radius:18px; padding:14px 16px; font-size:15px; background:#fff; resize:vertical; color:var(--ink); }
  textarea::placeholder { color:#a6a29a; }

  .save { width:100%; margin-top:22px; border:0; border-radius:999px; background:var(--yellow); color:var(--navy); font-weight:900; font-size:19px;
          padding:17px; cursor:pointer; box-shadow:0 8px 0 -2px #d8ae00, 0 14px 26px rgba(0,59,137,.16); transition:transform .1s ease, box-shadow .1s ease; }
  .save:active { transform:translateY(4px); box-shadow:0 4px 0 -2px #d8ae00, 0 8px 16px rgba(0,59,137,.14); }
  .save:disabled { opacity:.55; pointer-events:none; }
  .sel { text-align:center; font-size:13.5px; font-weight:700; color:var(--muted); margin:12px 0 0; min-height:20px; }

  .done { display:none; margin-top:18px; background:var(--navy); color:var(--cream); border-radius:22px; padding:18px 20px; }
  .done.on { display:block; animation:pop .25s ease both; }
  .done b { display:flex; align-items:center; gap:10px; font-size:19px; font-weight:900; }
  .done b i { width:30px; height:30px; border-radius:50%; background:var(--yellow); color:var(--navy); display:grid; place-items:center; font-style:normal; font-size:16px; flex:none; }
  .done span { display:block; margin-top:8px; font-size:14px; color:rgba(240,237,230,.85); line-height:1.5; }
  .err { display:none; margin-top:18px; background:#fde8e6; color:var(--bad); font-weight:700; border-radius:18px; padding:14px 16px; font-size:14.5px; }
  .err.on { display:block; }
  @keyframes pop { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:none; } }

  .note { margin:26px 6px 0; font-size:13px; color:#6b6458; line-height:1.6; }
  .note b { color:var(--navy); }
  .loading { text-align:center; color:var(--muted); padding:40px 0; font-weight:600; }
  .foot { text-align:center; color:#a29c8f; font-size:11px; letter-spacing:.2em; margin-top:30px; font-weight:700; }
  .save.ghost { background:#fff; color:var(--navy); box-shadow:0 6px 0 -2px #d6d0c3; }
  .link-btn { display:block; margin:14px auto 0; border:0; background:none; color:var(--muted); font-weight:700; font-size:14px; text-decoration:underline; cursor:pointer; }

  .conf { margin-top:18px; background:#fff; border-radius:24px; padding:18px; }
  .conf-top { display:flex; align-items:center; gap:12px; }
  .conf-top i { width:38px; height:38px; border-radius:50%; background:var(--navy); color:var(--yellow); display:grid; place-items:center; font-style:normal; font-weight:900; font-size:19px; flex:none; }
  .conf-top span { font-size:19px; font-weight:900; color:var(--navy); }
  .conf-top small { display:block; font-size:12.5px; font-weight:600; color:var(--muted); }
  .conf-days { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; margin-top:16px; }
  .conf-days span { text-align:center; border-radius:12px; background:var(--cream); padding:8px 0 7px; color:#a29c8f; }
  .conf-days b { display:block; font-size:16px; font-weight:900; }
  .conf-days small { display:block; font-size:10.5px; font-weight:600; }
  .conf-days span.on { background:var(--navy); color:#fff; }
  .conf-days span.on small { opacity:.8; }
  .conf-sum { margin:14px 2px 0; font-size:15px; font-weight:600; color:#3b4352; }
  .conf-sum b { color:var(--navy); font-weight:900; }
  .conf-memo { margin:8px 0 0; background:var(--cream); border-radius:14px; padding:10px 12px; font-size:14px; white-space:pre-wrap; }

  .kakao { margin-top:18px; background:#fff4c2; border-radius:18px; padding:14px 16px; font-size:14px; line-height:1.55; color:#4a3b00; }
  .kakao b { display:block; font-size:15px; font-weight:900; color:#3a2e00; margin-bottom:2px; }
  .kakao.top { margin:16px 0 0; }
  .kakao.strong { background:var(--yellow); color:#2b2200; }

  .ask { position:fixed; inset:0; z-index:50; background:rgba(0,20,50,.55); display:flex; align-items:flex-end; justify-content:center; animation:fade .15s ease both; }
  .ask-box { background:var(--cream); width:100%; max-width:520px; border-radius:28px 28px 0 0; padding:24px 20px calc(20px + env(safe-area-inset-bottom)); animation:up .2s ease both; }
  .ask-box h3 { margin:0; font-size:22px; font-weight:900; color:var(--navy); }
  .ask-week { margin:6px 0 0; font-size:14px; font-weight:600; color:var(--muted); }
  .ask-week b { color:var(--navy); font-weight:900; }
  .ask-days { display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; }
  .ask-days span { min-width:46px; text-align:center; background:var(--navy); color:#fff; border-radius:14px; padding:10px 8px; font-weight:900; font-size:17px; }
  .ask-days span.add { box-shadow:inset 0 -4px 0 var(--yellow); }
  .ask-days em { font-style:normal; font-weight:800; color:var(--muted); background:#fff; border-radius:14px; padding:10px 14px; }
  .ask-diff { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 0; font-size:14px; font-weight:800; }
  .ask-diff .p { color:var(--ok); } .ask-diff .m { color:var(--bad); }
  .ask-memo { margin:12px 0 0; font-size:14px; color:#3b4352; white-space:pre-wrap; }
  .ask-btns { display:grid; grid-template-columns:1fr 1.4fr; gap:8px; margin-top:22px; }
  .ask-btns button { border:0; border-radius:999px; padding:15px; font-size:16px; font-weight:900; cursor:pointer; }
  .ask-btns .no { background:#fff; color:#4b5260; }
  .ask-btns .yes { background:var(--yellow); color:var(--navy); box-shadow:0 5px 0 -1px #d8ae00; }
  .ask-btns .yes:disabled { opacity:.6; }
  .done-box .ask-btns { grid-template-columns:1fr; }
  .done-ic { width:52px; height:52px; border-radius:50%; background:var(--navy); color:var(--yellow); display:grid; place-items:center; font-size:26px; font-weight:900; margin-bottom:12px; }
  @keyframes fade { from { opacity:0; } }
  @keyframes up { from { transform:translateY(30px); opacity:.6; } }
  .back { border:0; background:none; color:var(--navy); font-weight:800; font-size:14px; padding:0 2px 12px; cursor:pointer; }
  .mine { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mine button { border:0; border-radius:18px; background:var(--navy); color:#fff; font-weight:900; font-size:17px; padding:16px 10px; cursor:pointer; box-shadow:0 4px 0 -1px #00265a; }
  .q { width:100%; border:0; border-radius:16px; padding:13px 16px; font-size:16px; background:#fff; margin-bottom:10px; }
  .names { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .names button { border:0; border-radius:14px; background:#fff; padding:13px 4px; font-weight:800; font-size:15px; color:var(--ink); cursor:pointer; word-break:keep-all; line-height:1.25; }
  .names button:active { background:var(--yellow); }
  .muted-p { grid-column:1/-1; color:var(--muted); font-size:14px; text-align:center; }
  .pin { width:100%; margin-top:18px; border:0; border-radius:18px; background:#fff; text-align:center; font-size:32px; font-weight:900; letter-spacing:.4em; padding:14px 0 14px .4em; color:var(--navy); }
  .pin-err { min-height:20px; margin:8px 0 0; color:var(--bad); font-weight:700; font-size:14px; }
  /* 모바일: 화면이 옆으로 밀리거나 입력 시 확대되지 않게 */
  html { overflow-x:hidden; overflow-x:clip; }
  html, body { max-width:100%; overscroll-behavior-x:none; }
  body { overflow-x:clip; }
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size:16px !important; max-width:100%; min-width:0; }
  img, video, canvas { max-width:100%; }
</style>
</head>
<body>
<header class="hero">
  <img class="logo" src="logo.png" alt="댕겨올개">
  <h1 id="title"><em>픽드랍</em> 신청</h1>
  <p>픽드랍이 필요한 요일을 모두 눌러 주세요.<br>고른 뒤 확정하면 끝! 같은 링크에서 직접 고칠 수도 있어요.</p>
</header>

<main class="sheet">
  <div id="body" class="loading">불러오는 중…</div>
  <div id="err" class="err"></div>
  <div class="foot">DAENGGYEOLGAE</div>
</main>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
const FN = `${SUPABASE_URL}/functions/v1/pd`;
let token = new URLSearchParams(location.search).get("k") || new URLSearchParams(location.hash.slice(1)).get("k") || "";
const G = new URLSearchParams(location.search).get("g") || ""; // 모두에게 보내는 단체 링크
const MY_KEY = "pd-my";
const myDogs = () => { try { return JSON.parse(localStorage.getItem(MY_KEY) || "[]"); } catch { return []; } };
function rememberDog(t, n) { const l = myDogs().filter((x) => x.t !== t); l.unshift({ t, n }); try { localStorage.setItem(MY_KEY, JSON.stringify(l.slice(0, 6))); } catch { /* 저장 안 돼도 됨 */ } }
const DOW = ["", "월", "화", "수", "목", "금", "토", "일"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const addDays = (d, n) => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const dayList = (days) => days.length ? days.map((d) => DOW[d]).join("·") : "없음";

async function call(body) {
  const r = await fetch(FN, { method: "POST", headers: { "content-type": "application/json", apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ ...(token ? { token } : {}), ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || "연결하지 못했어요. 잠시 후 다시 해 주세요.");
  return j;
}
function showErr(m) { const e = $("#err"); e.textContent = m; e.classList.add("on"); }

let S = null;     // { dog, today, weeks }
let wi = 0;       // 고른 주
let pick = new Set();
let editing = false; // 확정된 주를 고치는 중

const datesOf = (w) => [1, 2, 3, 4, 5, 6, 7].map((d) => addDays(w.start, d - 1));
const stamp = (ts) => { if (!ts) return ""; const k = new Date(Date.parse(ts) + 9 * 3600e3).toISOString(); const d = k.slice(0, 10); return `${md(d)}(${DOW[((new Date(d + "T00:00:00Z").getUTCDay() + 6) % 7) + 1]}) ${k.slice(11, 16)}`; };
const KAKAO = "변경하신 뒤에는 꼭 댕겨올개 카톡으로 메시지를 남겨 주세요.";

function weekTabs() {
  return `<div class="weeks">${S.weeks.map((x, i) => `<button data-w="${i}" class="${i === wi ? "on" : ""}">${i === 0 ? "이번 주" : "다음 주"}
    <span class="st ${x.saved ? "ok" : "no"}">${x.saved ? "확정" : "아직"}</span><small>${md(x.start)} ~ ${md(addDays(x.start, 6))}</small></button>`).join("")}</div>`;
}

function render() {
  const w = S.weeks[wi];
  $("#body").className = "";
  if (w.saved && !editing) renderConfirmed(w); else renderEdit(w);
  document.querySelectorAll("[data-w]").forEach((b) => b.onclick = () => { wi = +b.dataset.w; editing = false; pick = new Set(S.weeks[wi].days); $("#err").classList.remove("on"); render(); });
}

// 확정된 주: 읽기 화면 + 변경 버튼
function renderConfirmed(w) {
  const dates = datesOf(w);
  $("#body").innerHTML = `${weekTabs()}
    <div class="conf">
      <div class="conf-top"><i>✓</i><span>픽드랍 확정<small>${w.fixed ? "📌 매주 고정 요일이에요" : `${stamp(w.updated_at)} 확정`}</small></span></div>
      <div class="conf-days">${dates.map((dt, i) => `<span class="${w.days.includes(i + 1) ? "on" : ""} ${i >= 5 ? "we" : ""}"><b>${DOW[i + 1]}</b><small>${md(dt)}</small></span>`).join("")}</div>
      <p class="conf-sum">${w.days.length ? `<b>${dayList(w.days)}</b> 픽드랍해요` : "이 주는 픽드랍이 <b>없어요</b>"}</p>
      ${w.memo ? `<p class="conf-memo">📝 ${esc(w.memo)}</p>` : ""}
    </div>
    <button id="edit" class="save ghost">요일 변경하기</button>
    <div class="kakao"><b>💬 변경이 생기면</b>이 링크에서 직접 바꾸실 수 있어요.<br>${KAKAO}</div>`;
  $("#edit").onclick = () => { editing = true; pick = new Set(w.days); render(); };
}

// 고르기 화면 (처음 신청 / 변경)
function renderEdit(w) {
  const isThis = wi === 0;
  const dates = datesOf(w);
  const change = w.saved;
  $("#body").innerHTML = `${weekTabs()}
    ${change ? `<div class="kakao top"><b>💬 꼭 알려 주세요</b>${KAKAO}</div>` : ""}
    <h2>요일 고르기 <small>여러 개 고를 수 있어요</small></h2>
    <div class="days">${dates.map((dt, i) => {
      const d = i + 1;
      const past = isThis && dt < S.today;
      return `<button class="d ${d >= 6 ? "we" : ""} ${pick.has(d) ? "on" : ""}" data-d="${d}" ${past ? "disabled" : ""}><b>${DOW[d]}</b><small>${md(dt)}</small></button>`;
    }).join("")}</div>
    <div class="quick">
      <button data-q="wk">월~금 모두</button>
      <button data-q="none">이번엔 필요 없어요</button>
    </div>

    <h2>메모 <small>필요할 때만</small></h2>
    <textarea id="memo" maxlength="300" placeholder="예) 수요일은 9시 전에 와 주세요 / 금요일은 드랍만 해 주세요">${esc(change ? w.memo : (w.draftMemo ?? w.memo))}</textarea>

    <button id="save" class="save">${change ? "변경 확정하기" : "확정하기"}</button>
    ${change ? `<button id="cancel" class="link-btn">변경 안 하고 돌아가기</button>` : ""}
    <p class="sel" id="sel"></p>

    <p class="note">🐾 <b>매주 일요일 오후 6시까지</b> 다음 주 요일을 확정해 주세요.<br>확정한 뒤에도 이 링크에서 언제든 예약·수정할 수 있어요. 바꾸시면 <b>카톡으로도 꼭</b> 알려 주세요.</p>`;

  const pastSet = new Set(dates.map((dt, i) => (isThis && dt < S.today ? i + 1 : 0)).filter(Boolean));
  const updSel = () => { $("#sel").textContent = pick.size ? `고른 요일: ${dayList([...pick].sort())}` : "고른 요일이 없어요 (픽드랍 안 함)"; };
  const keepMemo = () => { w.draftMemo = $("#memo").value; };
  updSel();
  document.querySelectorAll(".d").forEach((b) => b.onclick = () => {
    const d = +b.dataset.d;
    pick.has(d) ? pick.delete(d) : pick.add(d);
    b.classList.toggle("on", pick.has(d));
    updSel();
  });
  document.querySelector('[data-q="wk"]').onclick = () => { keepMemo(); [1, 2, 3, 4, 5].forEach((d) => !pastSet.has(d) && pick.add(d)); renderEdit(w); };
  document.querySelector('[data-q="none"]').onclick = () => { keepMemo(); [...pick].forEach((d) => !pastSet.has(d) && pick.delete(d)); renderEdit(w); };
  $("#save").onclick = () => askConfirm(w, $("#memo").value);
  $("#cancel")?.addEventListener("click", () => { editing = false; delete w.draftMemo; pick = new Set(w.days); render(); });
}

// 확정 전 한 번 더 확인
function askConfirm(w, memo) {
  const days = [...pick].sort((a, b) => a - b);
  const change = w.saved;
  const added = days.filter((d) => !w.days.includes(d));
  const removed = w.days.filter((d) => !days.includes(d));
  const memoChanged = (w.memo || "") !== memo.trim();
  if (change && !added.length && !removed.length && !memoChanged) { editing = false; render(); return; }
  const ov = document.createElement("div");
  ov.className = "ask";
  ov.innerHTML = `<div class="ask-box">
    <h3>${change ? "이대로 변경할까요?" : "이대로 확정할까요?"}</h3>
    <p class="ask-week">${wi === 0 ? "이번 주" : "다음 주"} · ${md(w.start)} ~ ${md(addDays(w.start, 6))}</p>
    <div class="ask-days">${days.length ? days.map((d) => `<span class="${added.includes(d) && change ? "add" : ""}">${DOW[d]}</span>`).join("") : `<em>픽드랍 없음</em>`}</div>
    ${change && (added.length || removed.length) ? `<p class="ask-diff">${added.length ? `<span class="p">+ ${dayList(added)} 추가</span>` : ""}${removed.length ? `<span class="m">− ${dayList(removed)} 빠짐</span>` : ""}</p>` : ""}
    ${memo.trim() ? `<p class="ask-memo">📝 ${esc(memo.trim())}</p>` : ""}
    ${change ? `<div class="kakao"><b>💬 잊지 마세요</b>${KAKAO}</div>` : ""}
    <div class="ask-btns"><button class="no">다시 고르기</button><button class="yes">${change ? "변경 확정" : "확정"}</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener("click", (e) => { if (e.target === ov) close(); });
  ov.querySelector(".no").onclick = close;
  ov.querySelector(".yes").onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = "저장하는 중…";
    const ok = await save(w, days, memo, change);
    close();
    if (ok) showDone(w, change);
  };
}

async function save(w, days, memo, change) {
  $("#err").classList.remove("on");
  try {
    const r = await call({ action: "save", week_start: w.start, days, memo });
    Object.assign(w, { saved: true, fixed: false, days: r.days, memo: r.memo || "", updated_at: new Date().toISOString() });
    delete w.draftMemo;
    pick = new Set(r.days);
    editing = false;
    render();
    return true;
  } catch (e) {
    showErr(e.message);
    return false;
  }
}

function showDone(w, change) {
  const ov = document.createElement("div");
  ov.className = "ask";
  ov.innerHTML = `<div class="ask-box done-box">
    <div class="done-ic">✓</div>
    <h3>${change ? "변경했어요" : "확정했어요"}</h3>
    <p class="ask-week">${wi === 0 ? "이번 주" : "다음 주"} 픽드랍: <b>${dayList(w.days)}</b></p>
    ${change ? `<div class="kakao strong"><b>💬 지금 카톡으로 알려 주세요</b>바뀐 내용을 댕겨올개 카톡으로 꼭 메시지 남겨 주세요.<br>(예: “${esc(S.dog.name)} ${dayList(w.days)}로 변경했어요”)</div>`
      : `<p class="ask-memo">바뀌면 이 링크에서 다시 고치시고, 카톡으로도 알려 주세요.</p>`}
    <div class="ask-btns"><button class="yes">알겠어요</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector(".yes").onclick = () => ov.remove();
  ov.addEventListener("click", (e) => { if (e.target === ov) ov.remove(); });
}

async function openDog(t) {
  token = t;
  $("#err").classList.remove("on");
  $("#body").className = "loading"; $("#body").textContent = "불러오는 중…";
  try {
    S = await call({ action: "get" });
    rememberDog(t, S.dog.name);
    $("#title").innerHTML = `${esc(S.dog.name)}<br><em>픽드랍</em> 신청`;
    document.title = `${S.dog.name} 픽드랍 신청 · 댕겨올개`;
    wi = S.weeks.length > 1 ? 1 : 0; // 링크는 항상 다음 주부터 보여 줌 (이번 주는 위 탭에서 볼 수 있음)
    editing = false;
    pick = new Set(S.weeks[wi].days);
    render();
    if (G) $("#body").insertAdjacentHTML("afterbegin", `<button class="back" id="back">‹ 다른 아이</button>`), $("#back").onclick = startGroup;
  } catch (e) {
    $("#body").innerHTML = ""; showErr(e.message);
    if (G) { $("#body").innerHTML = `<button class="back" id="back">‹ 처음으로</button>`; $("#back").onclick = startGroup; }
  }
}

// ---- 단체 링크: 보호자 전화번호로 우리 아이 찾기 (명단은 보여주지 않음)
async function startGroup() {
  token = ""; S = null;
  $("#err").classList.remove("on");
  $("#title").innerHTML = `<em>픽드랍</em> 신청`;
  document.title = "댕겨올개 픽드랍 신청";
  const mine = myDogs();
  $("#body").className = "";
  $("#body").innerHTML = `
    ${mine.length ? `<h2>우리 아이 <small>누르면 바로 열려요</small></h2>
      <div class="mine">${mine.map((m) => `<button data-t="${esc(m.t)}">🐶 ${esc(m.n)}</button>`).join("")}</div>
      <h2>다른 번호로 찾기</h2>` : `<h2>보호자 전화번호를 입력해 주세요</h2>`}
    <input id="ph" class="q" type="tel" inputmode="numeric" placeholder="010-0000-0000" autocomplete="tel">
    <button id="find" class="save">우리 아이 찾기</button>
    <div id="found"></div>
    <p class="note">🐾 댕겨올개에 등록한 보호자 번호로 찾아요. 이 폰에서는 다음부터 ‘우리 아이’를 누르면 바로 열려요.</p>`;
  const find = async () => {
    const btn = $("#find");
    $("#err").classList.remove("on");
    if ($("#ph").value.replace(/\D/g, "").length < 10) { showErr("전화번호를 정확히 입력해 주세요. (예: 010-1234-5678)"); return; }
    btn.disabled = true; btn.textContent = "찾는 중…";
    try {
      const r = await call({ action: "find", g: G, phone: $("#ph").value });
      if (r.dogs.length === 1) return openDog(r.dogs[0].token);
      r.dogs.forEach((d) => rememberDog(d.token, d.name));
      $("#found").innerHTML = `<h2>어느 아이를 신청할까요?</h2><div class="mine">${r.dogs.map((d) => `<button data-t="${esc(d.token)}">🐶 ${esc(d.name)}</button>`).join("")}</div>`;
      document.querySelectorAll("#found [data-t]").forEach((b) => b.onclick = () => openDog(b.dataset.t));
    } catch (e) { showErr(e.message); }
    btn.disabled = false; btn.textContent = "우리 아이 찾기";
  };
  $("#find").onclick = find;
  $("#ph").onkeydown = (e) => { if (e.key === "Enter") find(); };
  document.querySelectorAll(".mine [data-t]").forEach((b) => b.onclick = () => openDog(b.dataset.t));
}

(async () => {
  if (token) return openDog(token);
  if (G) return startGroup();
  $("#body").innerHTML = ""; showErr("링크가 맞지 않아요. 댕겨올개에서 받은 링크로 다시 열어 주세요.");
})();
</script>
</body>
</html>
